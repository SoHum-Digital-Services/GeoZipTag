// GeoZipTag Android app: a standard Gradle build (needed for Google's ads SDK).
pluginManagement {
    repositories {
        google()
        // Google's mirror of Maven Central (Maven Central itself rate-limits busy build machines).
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        // Google's mirror of Maven Central (Maven Central itself rate-limits busy build machines).
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
    }
}
rootProject.name = 'GeoZipTag'
include ':app'
