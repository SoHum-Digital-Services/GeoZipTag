# Publishes the browser version of the app and the signed wireless update to GitHub Pages (the gh-pages branch).
#   main            -> the live site and the live update (what installed apps follow)
#   any other branch -> /preview/ (a separate site and update; phones follow it only with Settings > Preview versions)
# Each run keeps the other half as it was. Setup: see tools/ota/README.md.
name: Publish web app and app updates

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "web/**"
      - "android/ota-min-apk.txt"
      - "tools/ota/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Never publish an update if the update logic itself is broken.
      - name: Test the update logic
        run: bash tools/ota/test/run.sh

      # What is published already, so the half this run does not touch stays as it is.
      - name: Fetch the published site
        run: |
          git clone -q --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" published || mkdir published

      - name: Build the site and the signed update
        env:
          OTA_PRIVATE_KEY: ${{ secrets.OTA_PRIVATE_KEY }}
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then
            echo "Publishing the LIVE version"
            node tools/ota/publish.mjs --out _site
            if [ -d published/preview ]; then cp -R published/preview _site/preview; fi
          else
            echo "Publishing the PREVIEW version (branch $GITHUB_REF_NAME)"
            node tools/ota/publish.mjs --out _preview --channel preview
            rm -rf _site && mkdir _site
            cp -R published/. _site/
            rm -rf _site/.git _site/preview
            cp -R _preview _site/preview
          fi
          touch _site/.nojekyll

      - name: Publish to the gh-pages branch
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
