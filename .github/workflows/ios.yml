# Builds the iOS app on a Mac runner and checks that it starts and serves its web files.
# The result is an UNSIGNED .ipa (artifact "GeoZipTag-ios-unsigned"); see ios/README.md for installing it.
name: Build iOS app

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "ios/**"
      - "web/**"
      - "android/app/src/main/assets/ota-public-key.b64"
      - "tools/ota/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # Same update logic tests as Android's, for the Swift updater (signed lists, hashes, rollback).
      - name: Test the iOS update logic
        run: bash tools/ota/test/ios/run.sh

      # The version of the web files built into the app, so it only accepts newer wireless updates.
      - name: Stamp the built-in web version
        run: printf '%s\n%s\n' "$(( $(date -u +%s) / 60 ))" "$(date -u +%y.%m.%d-%H%M)" > ios/GeoZipTag/ota-version.txt

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for a real iPhone (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project GeoZipTag.xcodeproj -scheme GeoZipTag -configuration Release \
            -sdk iphoneos -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40
          # Wireless updates name a minimum app build (android/ota-min-apk.txt); the app must meet it.
          plist=build/device/Build/Products/Release-iphoneos/GeoZipTag.app/Info.plist
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$plist")
          build=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$plist")
          minimum=$(cat ../android/ota-min-apk.txt)
          echo "App version $version, build $build (updates need build >= $minimum)"
          [ "$build" -ge "$minimum" ] || { echo "::error::iOS build number $build is below $minimum"; exit 1; }
          mkdir -p Payload
          cp -R build/device/Build/Products/Release-iphoneos/GeoZipTag.app Payload/
          zip -qr GeoZipTag-unsigned.ipa Payload
          ls -la GeoZipTag-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: GeoZipTag-ios-unsigned
          path: ios/GeoZipTag-unsigned.ipa

      # A stable download link for sideloading (Sideloadly / AltStore):
      # https://github.com/SoHum-Digital-Services/GeoZipTag/releases/download/ios-latest/GeoZipTag-unsigned.ipa
      - name: Publish the unsigned .ipa as a download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Unsigned build of ${{ github.sha }}. Sign it with your Apple ID using Sideloadly or AltStore (see ios/README.md)."
          # Replace the file in the existing release (keeps the link); create the release only if it is missing.
          # Retried, since GitHub's release API sometimes answers with a temporary server error.
          for attempt in 1 2 3 4; do
            if gh release view ios-latest >/dev/null 2>&1; then
              gh release upload ios-latest ios/GeoZipTag-unsigned.ipa --clobber &&
                gh release edit ios-latest --notes "$notes" && exit 0
            else
              gh release create ios-latest ios/GeoZipTag-unsigned.ipa --prerelease --target "${{ github.sha }}" \
                --title "iOS app (unsigned, latest build)" --notes "$notes" && exit 0
            fi
            echo "Publishing failed (attempt $attempt), retrying..."; sleep $((attempt * 15))
          done
          exit 1

      - name: Build for the simulator and start the app
        working-directory: ios
        run: |
          xcodebuild -project GeoZipTag.xcodeproj -scheme GeoZipTag -configuration Debug \
            -sdk iphonesimulator -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO build | tail -20
          DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "Simulator: $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE"
          xcrun simctl install "$DEVICE" build/sim/Build/Products/Debug-iphonesimulator/GeoZipTag.app
          xcrun simctl launch "$DEVICE" cc.sohum.geoziptag
          sleep 8
          curl -sf -o /dev/null -w "index.html: %{http_code}\n" http://127.0.0.1:47653/index.html
          curl -sf -o /dev/null -w "camera.js: %{http_code}\n" http://127.0.0.1:47653/camera.js
          curl -s -o /dev/null -w "missing file: %{http_code}\n" http://127.0.0.1:47653/nope.js
          curl -s -o /dev/null -w "traversal: %{http_code}\n" --path-as-is http://127.0.0.1:47653/../Info.plist
          xcrun simctl io "$DEVICE" screenshot sim.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshot
          path: ios/sim.png
          if-no-files-found: ignore
